name: CI

on:
  push:
    branches: [main, qa/ec4206-role-c]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Install, typecheck, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: riven
          POSTGRES_PASSWORD: riven_ci_test_only
          POSTGRES_DB: riven_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riven -d riven_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://riven:riven_ci_test_only@127.0.0.1:5432/riven_ci_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check database migrations and constraints
        run: npm run db:check

      - name: Run tests
        run: npm test
      - name: Run Cucumber BDD tests
        run: npm run test:bdd

      - name: Run tests with coverage
        run: npm run test:coverage -- --maxWorkers=1 --testTimeout=15000

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        with:
          name: role-b-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run Role C browser tests
        run: npm run test:e2e

      - name: Save signed-in screenshot
        uses: actions/upload-artifact@v7
        with:
          name: role-c-browser-evidence
          path: test-results/**/signed-in.png
          if-no-files-found: error
          retention-days: 7
