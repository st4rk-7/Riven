name: riven

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: riven_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - riven-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riven_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  # Full stack for a local production-style check: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/riven_dev
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: http://127.0.0.1:8080
      WEB_ORIGIN: http://127.0.0.1:8080
      RIVEN_EXTENSION_ORIGIN: ${RIVEN_EXTENSION_ORIGIN:-}
    ports:
      - "127.0.0.1:8080:3000"

volumes:
  riven-postgres-data: